{% extends "prix/base.html" %}

{% block titre %}Confirmer la suppression{% endblock %}

{% block contenu %}
    <h2>Confirmer la suppression</h2>
    <p>Voulez-vous vraiment supprimer : <strong>{{ objet }}</strong> ?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Oui, supprimer</button>
        <a href="{% url retour %}">Annuler</a>
    </form>
{% endblock %}
